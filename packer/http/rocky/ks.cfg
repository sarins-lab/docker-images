# Rocky Linux 9 Kickstart — unattended minimal install for Packer builds
# The packer user and its sudoers entry are removed in the cleanup provisioner.

text
skipx
reboot

lang en_US.UTF-8
keyboard us
timezone UTC --isUtc

# Disk
zerombr
clearpart --all --initlabel
autopart --type=plain --nohome

# Network — DHCP; Packer communicates via SSH
network --bootproto=dhcp --onboot=on

# Repositories
url --mirrorlist=https://mirrors.rockylinux.org/mirrorlist?arch=$basearch&repo=BaseOS-9

# Packages
%packages --ignoremissing --excludedocs
@^minimal-environment
openssh-server
ca-certificates
curl
-plymouth
-btrfs-progs
%end

# Services
services --enabled=sshd

# Root account locked — packer user handles provisioning
rootpw --lock

# Build-time packer user — removed by Packer cleanup provisioner
user --name=packer --plaintext --password=packer-build --groups=wheel

%post --log=/root/ks-post.log
# Grant passwordless sudo for Packer SSH commands
echo 'packer ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/packer
chmod 0440 /etc/sudoers.d/packer

# Enable SSH password auth for Packer connection (key not yet injected)
sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

# Minimal dnf cleanup
dnf clean all
rm -rf /var/cache/dnf
%end
